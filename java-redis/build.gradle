
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'java'
apply plugin: 'eclipse'

bootJar.enabled = true
jar.enabled = false


buildscript {
	ext {
		springBootVersion = '3.2.10'
		set('springCloudVersion', '2023.0.3')
		set('log4j2.version', '2.17.1')
	}

	repositories {
		mavenCentral()
		maven { url "https://plugins.gradle.org/m2/" }
		maven { url "https://repo.ustraframework.kro.kr/repository/maven-public/" }
	}

	dependencies {
		classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
		classpath('io.spring.gradle:dependency-management-plugin:1.0.9.RELEASE')
		classpath("io.franzbecker:gradle-lombok:1.8")
	}
}

// configuration setting version
configurations.all {
	resolutionStrategy.eachDependency { DependencyResolveDetails details ->
		if (details.requested.group == 'org.apache.logging.log4j') {
			details.useVersion '2.17.1'
		}
	}
}

group = 'com.gsitm.ustra.java'
version = '0.0.1-SNAPSHOT'

sourceCompatibility = 17
targetCompatibility = 17

eclipse {
	classpath { downloadSources=true }
}


ext {
	ustraVersion = '3.4.1'
	set('springCloudVersion', '2023.0.3')
	set('log4j2.version', '2.17.1')
}


dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

task initSourceFolders {
	sourceSets*.java.srcDirs*.each {
		if (!it.exists()) {
			it.mkdirs()
		}
	}

	sourceSets*.resources.srcDirs*.each {
		if (!it.exists()) {
			it.mkdirs()
		}
	}
}

repositories {
	mavenCentral()
	maven { url "https://repo.ustraframework.kro.kr/repository/maven-public/" }
}



dependencies {
	implementation 'org.apache.logging.log4j:log4j-to-slf4j:2.17.1'
	implementation 'org.apache.logging.log4j:log4j-api:2.17.1'
	implementation 'ch.qos.logback:logback-core:1.4.14'
	implementation 'ch.qos.logback:logback-classic:1.4.14'

	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	compileOnly 'org.projectlombok:lombok'

	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'

	testAnnotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'

	implementation "com.gsitm.ustra.java.starter:ustra-starter-vue-bo:${ustraVersion}"
	implementation "com.gsitm.ustra.java:ustra-data-redis:${ustraVersion}"

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'

	compileOnly 'org.springframework.boot:spring-boot-devtools'

	implementation 'org.postgresql:postgresql:42.7.3'
}


task shadowJar {

	dependsOn 'jar'
	doLast {
		delete fileTree(dir: "build", exclude: "libs")
		delete fileTree(dir: "build/libs", exclude: "*.jar")
	}
}
